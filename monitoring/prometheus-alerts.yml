groups:
- name: sm-cmdb-alerts
  rules:
  - alert: SMCMDBServiceDown
    expr: up{job="sm-cmdb"} == 0
    for: 1m
    labels:
      severity: Critical
      service: sm-cmdb
    annotations:
      summary: '{{ $labels.instance }} SM CMDB 服务不可用'
      description: SM CMDB（sm-cmdb）的 up 指标已连续 1 分钟为 0，目标实例可能已宕机或无法被 Prometheus 抓取。
  - alert: SMCMDBHighErrorRate
    expr: sum(rate(sm_cmdb_http_requests_total{status=~"5.."}[5m])) / sum(rate(sm_cmdb_http_requests_total[5m]))
      > 0.05
    for: 5m
    labels:
      severity: Warning
      service: sm-cmdb
    annotations:
      summary: SM CMDB 5xx 错误率超过 5%
      description: SM CMDB（sm-cmdb）过去 5 分钟 5xx 响应占比 超过 5%（当前值 {{ $value | humanizePercentage
        }}），请检查上游依赖与错误日志。
  - alert: SMCMDBHighLatency
    expr: (sum(rate(sm_cmdb_latency_ms_total[5m])) / sum(rate(sm_cmdb_requests_total[5m])))
      > 1000
    for: 5m
    labels:
      severity: Warning
      service: sm-cmdb
    annotations:
      summary: SM CMDB 请求平均延迟超过 1s
      description: SM CMDB（sm-cmdb）过去 5 分钟请求平均延迟 （rate(latency_ms_total)/rate(requests_total)）超过
        1000ms（当前 {{ $value | humanize }} ms）。注：该服务未暴露延迟直方图，此处用平均延迟近似 p99 高延迟告警。
  - alert: SMCMDBHighMemoryUsage
    expr: sum(container_memory_working_set_bytes{pod=~"sm-cmdb-.*", container!="",
      container!="POD"}) by (pod) > 536870912
    for: 5m
    labels:
      severity: Warning
      service: sm-cmdb
    annotations:
      summary: SM CMDB 进程内存超过 512MB
      description: '{{ $labels.pod }} 容器工作集内存超过 512MiB（当前 {{ $value | humanize1024
        }B），SM CMDB（sm-cmdb）存在内存泄漏或 OOM 风险，请排查。'
