[project]
name = "SM-CMDB"
version = "2.0.0"
description = "资产配置管理系统：资产类型、资产实例、关系与依赖拓扑"
requires-python = ">=3.11"

[tool.ruff]
line-length = 200
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
